name: CI Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true # .NET 10 preview/RC builds

      - name: Restore Dependencies
        run: dotnet restore Gitic.slnx

      - name: Build Solution
        run: dotnet build Gitic.slnx -c Release --no-restore

      - name: Run Tests
        run: dotnet test Gitic.slnx -c Release --no-build --logger "console;verbosity=normal"
